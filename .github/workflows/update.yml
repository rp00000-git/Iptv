name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-iptv
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify playlists
        run: python3 scripts/build_playlist.py
      - name: Build Israel, US and UK EPG
        continue-on-error: true
        run: python3 scripts/build_epg.py
      - name: Ensure EPG files exist
        run: |
          test -s epg.xml || printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?><tv></tv>' > epg.xml
          test -s epg.xml.gz || gzip -9 -c epg.xml > epg.xml.gz
      - name: Commit refreshed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u epg.xml epg.xml.gz status.json
          test ! -f playlist-backup.m3u || git add playlist-backup.m3u
          git diff --cached --quiet || git commit -m "chore: refresh IPTV playlist"
          git push
